<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa391"/><stop offset="1" stop-color="#245f56"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f1e8d6"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2735a"/><stop offset="1" stop-color="#d84a30"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e65a3f"/><stop offset="1" stop-color="#b93a24"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#2a0c04" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <g clip-path="url(#body)">
    <!-- paper, bleeds off the bottom -->
    <g transform="rotate(-4 512 700)">
      <rect x="200" y="470" width="624" height="600" rx="40" fill="url(#paper)"/>
    </g>
    <!-- impression -->
    <g transform="rotate(-10 505 665)" fill="none" stroke="#d9472b" opacity="0.92">
      <circle cx="505" cy="665" r="140" stroke-width="24"/>
      <circle cx="505" cy="665" r="105" stroke-width="8"/>
      <path d="M445 670 L492 718 L572 618" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- stamp tool, lifted -->
    <g transform="rotate(9 540 400)" filter="url(#sh2)">
      <rect x="478" y="320" width="124" height="90" fill="#c9412a"/>
      <rect x="465" y="130" width="150" height="230" rx="75" fill="url(#tool)"/>
      <rect x="380" y="385" width="320" height="86" rx="32" fill="url(#base)"/>
      <rect x="400" y="392" width="280" height="8" rx="4" fill="#fff" opacity="0.35"/>
      <ellipse cx="520" cy="190" rx="26" ry="40" fill="#fff" opacity="0.18"/>
    </g>
  </g>
</svg>
