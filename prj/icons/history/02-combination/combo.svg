<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26c6dc"/><stop offset="1" stop-color="#0a5f9a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf1f5"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f29a0c"/><stop offset="1" stop-color="#d9730a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcb3d"/><stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <clipPath id="sheetclip"><rect x="360" y="190" width="410" height="460" rx="22"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="sh2" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="-5" stdDeviation="9" flood-color="#5a2a00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <!-- back panel with tab -->
  <path d="M215 405 Q215 355 265 355 H370 Q400 355 418 380 L440 405 H770 Q810 405 810 445 V760 H215 Z" fill="url(#back)"/>
  <!-- sheet with stamp -->
  <rect x="360" y="190" width="410" height="460" rx="22" fill="url(#paper)"/>
  <g clip-path="url(#sheetclip)">
    <rect x="415" y="240" width="220" height="24" rx="12" fill="#b9c8d2"/>
    <g transform="rotate(-14 565 450)" fill="none" stroke="#e8321f">
      <circle cx="565" cy="450" r="140" stroke-width="26"/>
      <circle cx="565" cy="450" r="104" stroke-width="9"/>
      <path d="M502 455 L551 505 L636 400" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- front panel -->
  <path d="M185 575 Q185 535 225 535 H800 Q840 535 840 575 V775 Q840 815 800 815 H225 Q185 815 185 775 Z" fill="url(#front)" filter="url(#sh2)"/>
  <rect x="200" y="537" width="625" height="7" rx="3.5" fill="#fff" opacity="0.45"/>
</svg>
